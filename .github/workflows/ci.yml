name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NARRATIVERADAR_MOCK: "1"

jobs:
  test:
    name: pytest offline (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Unit + CLI tests (fixtures only)
        run: pytest -q --tb=short

      - name: Mock CLI smoke
        run: |
          narrativeradar brief --format all --out /tmp/nr-out --quiet
          test -f /tmp/nr-out/brief.json
          test -f /tmp/nr-out/brief.md
          test -f /tmp/nr-out/watchlist.csv
          narrativeradar watch --once --state /tmp/nr-state.json
